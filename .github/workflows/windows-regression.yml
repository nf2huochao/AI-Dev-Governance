name: Windows regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell regression suite
        shell: powershell
        run: |
          & ./tests/run-tests.ps1
  windows-pwsh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell 7 regression suite
        shell: pwsh
        run: |
          & ./tests/run-tests.ps1
