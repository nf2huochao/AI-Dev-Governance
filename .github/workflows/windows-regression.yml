name: Windows regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Run regression suite
        shell: ${{ matrix.shell }}
        run: |
          & ./tests/run-tests.ps1
